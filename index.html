    function calcularHash(cadena) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < cadena.length; i++) {
        const ch = cadena.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0));
    }

    function obtenerODefinirDeviceId() {
      try {
        let id = localStorage.getItem("digimoto_device_id") || localStorage.getItem("digimoto_device_id");
        if (!id || id.startsWith("SA-")) {
          const rand = Math.random().toString(36).substring(2, 6) + Math.random().toString(36).substring(2, 6);
          const t = Date.now().toString(36).slice(-4);
          id = `DM-${rand.slice(0, 4).toUpperCase()}-${t.toUpperCase()}`;
          localStorage.setItem("digimoto_device_id", id);
        }
        return id;
      } catch (e) {
        return "DM-DEMO-0001";
      }
    }

    function derivarCodigoActivacion(deviceId) {
      if (!deviceId) return "";
      const idLimpio = deviceId.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (idLimpio.length < 4) return "";
      const semilla = idLimpio + "::" + SECRET_KEY;
      const h1 = Math.abs(calcularHash(semilla + "_A")).toString(36).toUpperCase().padStart(4, "X").slice(0, 4);
      const h2 = Math.abs(calcularHash(semilla + "_B")).toString(36).toUpperCase().padStart(4, "Y").slice(0, 4);
      return `MOTO-${h1}-${h2}`;
    }

    function validarCodigoActivacion(deviceId, codigoIngresado) {
      if (!deviceId || !codigoIngresado) return false;
      const esperado = derivarCodigoActivacion(deviceId);
      const normalizado = codigoIngresado.trim().toUpperCase().replace(/\s+/g, "");
      return normalizado === esperado;
    }

    // Canvas interactivo para la firma digital
    function CanvasFirma({ valorFirma, onFirmaChange }) {
      const canvasRef = useRef(null);
      const dibujando = useRef(false);

      useEffect(() => {
        const cvs = canvasRef.current;
        if (!cvs) return;
        const ctx = cvs.getContext("2d");
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#1e3a8a";

        if (valorFirma) {
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            ctx.drawImage(img, 0, 0);
          };
          img.src = valorFirma;
        } else {
          ctx.clearRect(0, 0, cvs.width, cvs.height);
        }
      }, [valorFirma]);

      const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvasRef.current.width / rect.width;
        const scaleY = canvasRef.current.height / rect.height;
        return { 
          x: (clientX - rect.left) * scaleX, 
          y: (clientY - rect.top) * scaleY 
        };
      };

      const start = (e) => {
        dibujando.current = true;
        const ctx = canvasRef.current.getContext("2d");
        const { x, y } = getPos(e);
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const move = (e) => {
        if (!dibujando.current) return;
        const ctx = canvasRef.current.getContext("2d");
        const { x, y } = getPos(e);
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stop = () => {
        if (!dibujando.current) return;
        dibujando.current = false;
        onFirmaChange(canvasRef.current.toDataURL("image/png"));
      };

      const limpiar = () => {
        const cvs = canvasRef.current;
        const ctx = cvs.getContext("2d");
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        onFirmaChange("");
      };

      return (
        <div className="relative rounded-2xl overflow-hidden border border-[#2d3345] bg-[#14161d]">
          <canvas
            ref={canvasRef}
            width={400}
            height={140}
            className="w-full h-[140px] touch-none cursor-crosshair block"
            onMouseDown={start}
            onMouseMove={move}
            onMouseUp={stop}
            onTouchStart={start}
            onTouchMove={move}
            onTouchEnd={stop}
          />
          <span className="absolute bottom-2 left-3 text-[10px] tracking-wider uppercase text-gray-500 font-semibold pointer-events-none">
            ✍️ Firme aquí con dedo o cursor
          </span>
          <button
            onClick={limpiar}
            type="button"
            className="absolute top-2 right-2 px-2.5 py-1 text-[11px] font-bold rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 transition"
          >
            Limpiar Firma
          </button>
        </div>
      );
    }

    const idb = {
      db: null,
      open() {
        if (!this.db) this.db = new Promise((res, rej) => {
          const r = indexedDB.open("digimoto_fotos", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("f");
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
        return this.db;
      },
      async put(k, v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction("f", "readwrite"); t.objectStore("f").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
      async get(k) { const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction("f").objectStore("f").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
      async del(k) { try { const d = await this.open(); d.transaction("f", "readwrite").objectStore("f").delete(k); } catch (e) {} }
    };

              const max = 1024;

              cvs.width = Math.round(img.width * escala);

                    <button onClick={() => {
                      const n = nuevoArt.nombre.trim(); if (!n) return;
                      setStock((p) => [...p, { id: "i_" + Math.random().toString(36).slice(2, 8), nombre: n, stock: Number(nuevoArt.stock) || 0, minimo: Number(nuevoArt.minimo) || 0, costo: Number(nuevoArt.costo) || 0, precio: Number(nuevoArt.precio) || 0 }]);
                      setNuevoArt({ nombre: "", stock: "", minimo: "", costo: "", precio: "" });
                    }} className="col-span-2 h-10 rounded-xl bg-orange-500 text-black font-black text-xs">+ Agregar al inventario</button>
                  </div>
                </div>
                {/* Buscador */}
                <div className="relative">
                  <input
                    type="text"
                    value={busqueda}
                    onChange={(e) => setBusqueda(e.target.value)}
                    placeholder="Buscar por placas, nombre de cliente, modelo de auto o número de folio..."
                    className="w-full h-12 pl-11 pr-4 rounded-2xl bg-[#14161d] border border-[#2d3345] text-sm text-white focus:border-orange-500 outline-none"
                  />
                  <span className="absolute left-4 top-3.5 text-gray-500 text-base">🔍</span>
                </div>

                {/* Tabla de Órdenes */}
                <div className="rounded-3xl bg-[#14161d] border border-[#2d3345] overflow-x-auto">
                  <table className="w-full min-w-[760px] text-xs text-left">
                    <thead className="bg-[#1e212b] text-[10px] uppercase font-black text-gray-400 border-b border-[#2d3345]">
                      <tr>
                        <th className="p-4">Folio</th>
                        <th className="p-4">Vehículo</th>
                        <th className="p-4">Cliente / Teléfono</th>
                        <th className="p-4">Especialidad</th>
                        <th className="p-4">Estatus</th>
                        <th className="p-4 text-right">Total</th>
                        <th className="p-4 text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#2d3345]">
                      {ordenesFiltradas.length === 0 ? (
                        <tr>
                          <td colSpan="7" className="p-8 text-center text-gray-500">
                            No se encontraron órdenes con el término de búsqueda.
                          </td>
                        </tr>
                      ) : (
                        ordenesFiltradas.map((ord) => {
                          const tot = (ord.refacciones || []).reduce((a, r) => a + (r.cantidad * r.costo * (1 + (r.margen || 0) / 100)), 0) +
                                      (ord.manoObra || []).reduce((a, m) => a + (m.horas * m.costoHora), 0);
                          const totGen = ord.aplicarIVA ? tot * 1.16 : tot;
                          const esActiva = ord.id === ordenActiva.id;

                          return (
                            <tr key={ord.id} className={`hover:bg-[#1e212b]/50 transition ${esActiva ? "bg-orange-500/10" : ""}`}>
                              <td className="p-4 font-mono font-black text-orange-400">
                                #{ord.id}
                              </td>
                              <td className="p-4">
                                <p className="font-bold text-white">{ord.vehiculo || "Sin auto"}</p>
                                <p className="text-[11px] font-mono text-gray-400">{ord.placas || "SIN PLACAS"}</p>
                              </td>
                              <td className="p-4">
                                <p className="font-semibold text-white">{ord.cliente || "Sin cliente"}</p>
                                <p className="text-[11px] text-gray-400">{ord.telefono || "—"}</p>
                              </td>
                              <td className="p-4 uppercase text-[11px] font-bold text-gray-300">
                                {(ord.giros || [ord.tallerTipo]).join(" + ")}
                              </td>
                              <td className="p-4">
                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-black uppercase ${
                                  ord.estadoOrden === "entregado" ? "bg-green-500/20 text-green-400" :
                                  ord.estadoOrden === "listo" ? "bg-amber-500/20 text-amber-400" :
                                  "bg-orange-500/20 text-orange-400"
                                }`}>
                                  {ord.estadoOrden}
                                </span>
                              </td>
                              <td className="p-4 text-right font-black text-white text-sm">
                                {formatearMXN(totGen)}
                              </td>
                              <td className="p-4 text-center">
                                <div className="flex items-center justify-center gap-2">
                                  <button
                                    onClick={() => {
                                      setOrdenIdActiva(ord.id);
                                      setPestana("recepcion");
                                    }}
                                    className="px-3 py-1 rounded-lg bg-white/10 hover:bg-white text-white hover:text-black font-bold text-xs transition"
                                  >
                                    Abrir
                                  </button>
                                  <button
                                    onClick={() => eliminarOrden(ord.id)}
                                    className="px-2 py-1 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-xs"
                                    title="Eliminar orden"
                                  >
                                    🗑️
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* ========================================================
              MODAL DE IMPRESIÓN Y REPORTE OFICIAL PDF
          ======================================================== */}
          {modalPDF && (
            <div id="modal-pdf-container" className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
              <div id="modal-pdf-content" className="w-full max-w-3xl bg-white text-black rounded-3xl p-6 sm:p-8 space-y-6 max-h-[92vh] overflow-y-auto shadow-2xl">
                {/* Botones de acción modal */}
                <div className="flex items-center justify-between border-b pb-3 no-print">
                  <span className="text-xs font-bold text-gray-500 uppercase tracking-widest">
                    Documento Oficial para Cliente y Archivo
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => window.print()}
                      className="px-4 py-1.5 rounded-xl bg-blue-700 keep-white text-white font-extrabold text-xs hover:bg-blue-800 shadow"
                    >
                      🖨️ Imprimir / Guardar PDF
                    </button>
                    <button
                      onClick={() => setModalPDF(false)}
                      className="px-3 py-1.5 rounded-xl bg-gray-200 text-gray-700 font-bold text-xs hover:bg-gray-300"
                    >
                      Cerrar
                    </button>
                  </div>
                </div>

                {/* Encabezado del documento */}
                <div className="flex items-start justify-between border-b pb-4">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-xl bg-orange-600 keep-white text-white font-black text-2xl flex items-center justify-center overflow-hidden">
                      <img src="digimoto_logo.jpg" alt="DM" className="w-full h-full object-cover" onError={(e) => { e.currentTarget.style.display = "none"; e.currentTarget.parentNode.insertAdjacentText("beforeend", "DM"); }} />
                    </div>
                    <div>
                      <h1 className="text-2xl font-black text-black tracking-tight leading-tight">{taller.nombre || "DigiMoto PRO"}</h1>
                      <p className="text-[10px] text-gray-600">{taller.direccion}{taller.telefono ? ` • Tel. ${taller.telefono}` : ""}</p>
                      <p className="text-xs font-bold text-gray-600 uppercase tracking-wider">
                        Taller: {girosAct.join(" + ").toUpperCase()} • ORDEN LEGAL DE SERVICIO
                      </p>
                    </div>
                  </div>
                  <div className="text-right text-xs">
                    <p className="font-mono font-black text-sm text-black">FOLIO: #{ordenActiva.id}</p>
                    <p className="text-gray-600">Fecha: {ordenActiva.fechaIngreso} {ordenActiva.horaIngreso}</p>
                    <p className="text-[10px] text-gray-500">Validez: 15 días</p>
                  </div>
                </div>

                {/* Datos del Cliente y Vehículo */}
                <div className="grid grid-cols-2 gap-4 text-xs bg-gray-50 p-4 rounded-2xl border">
                  <div>
                    <p className="font-bold text-gray-500 uppercase text-[10px]">Cliente Titular</p>
                    <p className="font-black text-sm text-black">{ordenActiva.cliente || "Sin especificar"}</p>
                    <p className="text-gray-700">WhatsApp / Tel: {ordenActiva.telefono || "N/A"}</p>
                  </div>
                  <div>
                    <p className="font-bold text-gray-500 uppercase text-[10px]">Vehículo Registrado</p>
                    <p className="font-black text-sm text-black">{ordenActiva.vehiculo || "Vehículo"} ({ordenActiva.anio})</p>
                    <p className="font-mono font-bold text-gray-900">Placas: {ordenActiva.placas || "SIN PLACAS"} • {ordenActiva.kilometraje.toLocaleString()} km</p>
                    <p className="text-[11px] text-gray-600">Tanque: {ordenActiva.gasolina}% | VIN: {ordenActiva.vin || "N/A"}</p>
                  </div>
                </div>

                {/* Motivo o diagnóstico */}
                <div className="text-xs border p-3 rounded-xl bg-gray-50/50">
                  <span className="font-bold uppercase text-[10px] text-gray-500 block mb-0.5">Motivo de Ingreso / Diagnóstico Técnico:</span>
                  <p className="text-gray-800 font-medium">{ordenActiva.motivoFalla || "Mantenimiento general solicitado por el cliente."}</p>
                </div>

                {/* Desglose de Refacciones y Mano de Obra */}
                <div>
                  <h4 className="font-extrabold text-xs uppercase tracking-wider mb-2 text-black">
                    Desglose de Trabajos y Refacciones Cotizadas
                  </h4>
                  <table className="w-full text-xs text-left border rounded-xl overflow-hidden">
                    <thead className="bg-gray-100 border-b text-[10px] uppercase font-bold text-gray-700">
                      <tr>
                        <th className="p-2.5">Tipo</th>
                        <th className="p-2.5">Concepto</th>
                        <th className="p-2.5 text-center">Cant / Horas</th>
                        <th className="p-2.5 text-right">Importe</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y text-gray-800">
                      {(ordenActiva.refacciones || []).map((r) => {
                        const sub = r.cantidad * r.costo * (1 + (r.margen || 0) / 100);
                        return (
                          <tr key={r.id}>
                            <td className="p-2 font-bold text-[10px] text-gray-500">REFACCIÓN</td>
                            <td className="p-2 font-medium">{r.concepto || "Refacción"}</td>
                            <td className="p-2 text-center">{r.cantidad}</td>
                            <td className="p-2 text-right font-bold">{formatearMXN(sub)}</td>
                          </tr>
                        );
                      })}
                      {(ordenActiva.manoObra || []).map((m) => {
                        const subM = m.horas * m.costoHora;
                        return (
                          <tr key={m.id}>
                            <td className="p-2 font-bold text-[10px] text-blue-600">MANO DE OBRA</td>
                            <td className="p-2 font-medium">{m.concepto || "Servicio técnico"}</td>
                            <td className="p-2 text-center">{m.horas} hrs</td>
                            <td className="p-2 text-right font-bold">{formatearMXN(subM)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* Resumen de Importes */}
                <div className="flex justify-end text-xs">
                  <div className="w-64 space-y-1.5 border-t pt-2">
                    <div className="flex justify-between text-gray-600">
                      <span>Subtotal:</span>
                      <span className="font-bold text-black">{formatearMXN(subtotal)}</span>
                    </div>
                    {ordenActiva.aplicarIVA && (
                      <div className="flex justify-between text-gray-600">
                        <span>IVA (16%):</span>
                        <span className="font-bold text-black">{formatearMXN(iva)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-sm font-black text-black border-t pt-1">
                      <span>Total General:</span>
                      <span className="text-orange-600 text-base">{formatearMXN(totalGeneral)}</span>
                    </div>
                    <div className="flex justify-between text-gray-600">
                      <span>Anticipo Abonado:</span>
                      <span className="font-bold text-green-700">{formatearMXN(ordenActiva.anticipo)}</span>
                    </div>
                    <div className="flex justify-between text-xs font-black text-red-600 bg-red-50 p-1.5 rounded">
                      <span>Saldo Pendiente:</span>
                      <span>{formatearMXN(saldoPendiente)}</span>
                    </div>
                  </div>
                </div>

                {/* Cláusula Legal y Firmas */}
                <div className="border-t pt-4 text-[10px] text-gray-500 space-y-2">
                  <p>
                    <strong>Términos y Condiciones:</strong> El cliente autoriza la reparación de acuerdo al presupuesto expuesto y aprueba las pruebas de manejo necesarias. El taller no se hace responsable por objetos de valor no declarados en el inventario. La garantía del servicio cubre mano de obra y refacciones aplicadas por {taller.garantiaMeses || 3} meses o {taller.garantiaKm || 5000} km.
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-8 pt-4">
                  <div className="text-center">
                    <div className="h-20 border-b flex items-center justify-center">
                      {ordenActiva.firmaDigital ? (
                        <img src={ordenActiva.firmaDigital} alt="Firma Cliente" className="max-h-16 object-contain" />
                      ) : (
                        <span className="text-gray-300 text-xs italic">Sin firma digital registrada</span>
                      )}
                    </div>
                    <p className="text-xs font-bold text-black mt-1">Firma del Cliente Titular</p>
                    <p className="text-[10px] text-gray-500">{ordenActiva.cliente || "Nombre del cliente"}</p>
                  </div>
                  <div className="text-center">
                    <div className="h-20 border-b flex items-center justify-center">
                      <span className="text-gray-400 font-bold text-xs uppercase tracking-widest">Sello y Firma DigiMoto</span>
                    </div>
                    <p className="text-xs font-bold text-black mt-1">Firma / Sello de Recepción</p>
                    <p className="text-[10px] text-gray-500">Responsable Técnico del Taller</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<AppDigiMoto />);
  </script>
  <script>
    // Instalar como PWA (App independiente en celular) y funcionamiento offline
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .then((reg) => console.log("DigiMoto ServiceWorker registrado:", reg.scope))
          .catch((err) => console.warn("Error al registrar ServiceWorker:", err));
      });
    }
  </script>
</body>
</html>
